<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2a"><link rel="manifest" href="manifest.json">
<title>FarmLog</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><h1>FarmLog</h1><p>Farm operations diary</p></div><button id="install" hidden>Install</button></header>
<nav>
<button data-tab="dashboard">Today</button><button data-tab="activities">Activities</button>
<button data-tab="crops">Crops</button><button data-tab="harvest">Harvest</button>
</nav>
<main>
<section id="dashboard" class="tab active"><div class="cards" id="cards"></div><div class="quick">
<h2>Quick Add</h2><div class="grid">
<button onclick="openActivity('Fertigation')">💧 Fertigation</button><button onclick="openActivity('Spray')">🧪 Spray</button>
<button onclick="openActivity('Labour')">👷 Labour</button><button onclick="openActivity('Expense')">₹ Expense</button>
</div></div><div class="panel"><h2>Today's Log</h2><div id="today"></div></div></section>
<section id="activities" class="tab"><div class="sectionhead"><h2>Activities</h2><button onclick="openActivity()">＋ Add</button></div><div id="activityList"></div></section>
<section id="crops" class="tab"><div class="sectionhead"><h2>Crops</h2><button onclick="openCrop()">＋ Add</button></div><div id="cropList"></div></section>
<section id="harvest" class="tab"><div class="sectionhead"><h2>Harvest & Sales</h2><button onclick="openHarvest()">＋ Add</button></div><div id="harvestList"></div></section>
</main>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script src="app.js"></script>
</body></html>
