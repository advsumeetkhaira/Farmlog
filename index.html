<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2a"><link rel="manifest" href="manifest.json"><title>FarmLog</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>FarmLog</h1><p>Farm operating system</p></div><button id="install" hidden>Install</button></header><nav><button data-tab="dashboard">Today</button><button data-tab="operations">Operations</button><button data-tab="plots">Plots</button><button data-tab="harvest">Harvest</button><button data-tab="reports">Reports</button></nav><main><section id="dashboard" class="tab active"><div class="hero" id="seasonSummary"></div><div class="cards" id="cards"></div><div class="quick"><h2>Quick Add</h2><div class="grid"><button onclick="openOperation('Fertigation')">💧 Fertigation</button><button onclick="openOperation('Spray')">🧪 Spray</button><button onclick="openOperation('Labour')">👷 Labour</button><button onclick="openOperation('Expense')">₹ Expense</button><button onclick="openHarvest()">🚜 Harvest</button><button onclick="openPlot()">🌱 New Plot</button></div></div><div class="panel"><h2>Today's Work</h2><div id="today"></div></div></section><section id="operations" class="tab"><div class="sectionhead"><h2>Operations</h2><button onclick="openOperation()">＋ Add</button></div><div class="filters"><select id="opFilter" onchange="render()"><option value="all">All types</option><option>Fertigation</option><option>Spray</option><option>Labour</option><option>Irrigation</option><option>Expense</option><option>Other</option></select><select id="cropFilter" onchange="render()"><option value="all">All plots</option></select></div><div id="operationList"></div></section><section id="plots" class="tab"><div class="sectionhead"><h2>Plots & Crops</h2><button onclick="openPlot()">＋ Add</button></div><div id="plotList"></div></section><section id="harvest" class="tab"><div class="sectionhead"><h2>Harvest & Sales</h2><button onclick="openHarvest()">＋ Add</button></div><div class="cards" id="harvestStats"></div><div id="harvestList"></div></section><section id="reports" class="tab"><h2>Crop P&L</h2><div id="reportList"></div></section></main><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script src="app.js"></script></body></html>
