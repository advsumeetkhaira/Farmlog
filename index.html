<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153b25"><title>FarmLog</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#17221a;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding-bottom:80px}.top{background:#153b25;color:white;padding:24px 18px}.brand{font-size:27px;font-weight:800}.sub{opacity:.7;font-size:12px}.page{display:none;padding:18px;max-width:850px;margin:auto}.page.on{display:block}h1,h2{margin:0 0 14px}.hero{background:#1d5934;color:white;border-radius:20px;padding:20px;margin-bottom:14px}.hero b{font-size:32px}.metrics,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.card,.row,.panel{background:white;border:1px solid #dfe5df;border-radius:16px;padding:14px}.metric small,.row small{display:block;color:#6b756d;margin-top:5px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button,.btn,.nav button,.row button{border:0;border-radius:12px;padding:12px;background:#e5efe8;color:#17482b;font-weight:700}.quick button{text-align:left;background:white;border:1px solid #dfe5df}.section{margin-top:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:8px}.row>div{flex:1}.row button{padding:8px 10px}.empty{background:white;border:1px dashed #ccd5ce;padding:25px;text-align:center;color:#737c75;border-radius:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:7px;z-index:5}.nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:850px;margin:auto}.nav button{background:transparent;color:#747c76;padding:8px 3px;font-size:11px}.nav button.on{background:#e5efe8;color:#17482b}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{background:#f4f6f3;width:100%;max-width:600px;margin:auto auto 0;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between}.close{border:0;border-radius:10px;padding:8px 12px;font-size:20px}.form label{display:block;font-size:12px;font-weight:700;margin:12px 0}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #d7ded8;border-radius:11px;background:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.actions button{padding:11px 16px;border:0;border-radius:11px;font-weight:700}.actions #save{background:#153b25;color:white}.actions #cancel{background:#e4e9e5}@media(min-width:650px){.metrics,.cards{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}.modal{align-items:center;padding:20px}.sheet{border-radius:22px;margin:auto}}</style></head><body>
<header class="top"><div class="brand">FarmLog</div><div class="sub">Farm records • simple • local</div></header>
<section class="page on" id="dashboard"><div class="hero"><small>NET RECORDED</small><br><b id="net">₹0</b><div class="metrics"><div class="metric">Sales <b id="sales">₹0</b></div><div class="metric">Costs <b id="cost">₹0</b></div><div class="metric">Harvest <b id="kg">0 kg</b></div></div></div><div class="cards"><div class="card">Plots <b id="plotCount">0</b></div><div class="card">Work <b id="workCount">0</b></div><div class="card">Harvests <b id="harvestCount">0</b></div></div><div class="section"><h2>Quick add</h2><div class="quick"><button data-add="work">🧪 Work / Spray</button><button data-add="fertigation">💧 Fertigation</button><button data-add="harvest">🚜 Harvest</button><button data-add="expense">₹ Expense</button></div></div></section>
<section class="page" id="plots"><div class="head"><h2>Plots</h2><button class="btn" data-add="plot">＋ Plot</button></div><div class="list" id="plotList"></div></section>
<section class="page" id="work"><div class="head"><h2>Work</h2><button class="btn" data-add="work">＋ Work</button></div><div class="list" id="workList"></div></section>
<section class="page" id="harvest"><div class="head"><h2>Harvest & Sales</h2><button class="btn" data-add="harvest">＋ Harvest</button></div><div class="list" id="harvestList"></div></section>
<section class="page" id="reports"><h2>P&L</h2><div class="panel">Sales and costs are calculated from your recorded entries.</div></section>
<nav class="bottom"><div class="nav"><button class="on" data-page="dashboard">⌂<br>Today</button><button data-page="plots">▦<br>Plots</button><button data-page="work">✓<br>Work</button><button data-page="harvest">◒<br>Harvest</button><button data-page="reports">₹<br>P&L</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="title">Add</h2><button class="close" id="close">×</button></div><div class="form" id="bodyform"></div></div></div>
<script src="app12.js?v=2"></script></body></html>
